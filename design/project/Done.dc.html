<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>운동 완료</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F04A}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 32px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; font-weight: 700; color: #C8F04A">화 · 밀기 완료</span>
    <span style="font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1.2">오늘도 해냈습니다.</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 16px; background: #1C1D21; border: 1px solid #2A2C31">
        <span style="font-size: 13px; color: #A3A6AD">{{s.label}}</span>
        <span style="font-size: 24px; font-weight: 900">{{s.value}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; padding: 6px 16px; border-radius: 16px; background: #1C1D21; border: 1px solid #2A2C31">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #2A2C31">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 12px; color: #A3A6AD">{{r.done}}</span>
        </div>
        <span style="{{r.tagStyle}}">{{r.next}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; border: 1px solid #2A2C31">
    <span style="font-size: 12px; font-weight: 700; color: #C8F04A">트레이너 한 줄 평</span>
    <span style="font-size: 15px; line-height: 1.5">링 푸시업 4세트 모두 목표 상한. 다음 주는 링을 한 칸 낮춥니다. 딥스 네거티브는 아직 4초, 5초 채웁니다.</span>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <span style="font-size: 13px; color: #A3A6AD">내일</span>
    <span style="font-size: 14px; font-weight: 700">수 · 짧은 인터벌 400m × 6</span>
  </div>
  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #C8F04A; color: #111214; font-size: 17px; font-weight: 900; text-decoration: none">홈으로</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tag = 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; ';
    var up = tag + 'background: #C8F04A; color: #111214;';
    var keep = tag + 'border: 1px solid #3A3C42; color: #A3A6AD;';
    return {
      stats: [
        { label: '운동 시간', value: '46분' },
        { label: '총 세트', value: '17세트' },
        { label: '평균 난이도', value: '적당함' },
        { label: '연속 운동', value: '13일' }
      ],
      rows: [
        { name: '링 푸시업', done: '12 · 12 · 12 · 12회', next: '다음: 레벨업', tagStyle: up },
        { name: '링 딥스 (준비 단계)', done: '홀드 20초 · 네거티브 4초', next: '유지', tagStyle: keep },
        { name: '파이크 푸시업', done: '10 · 9 · 9회', next: '유지', tagStyle: keep },
        { name: '다이아몬드 푸시업', done: '15 · 14 · 15회', next: '+1회', tagStyle: up },
        { name: '할로우 홀드', done: '30 · 30 · 25초', next: '유지', tagStyle: keep }
      ]
    };
  }
}
</script>
</body>
</html>
