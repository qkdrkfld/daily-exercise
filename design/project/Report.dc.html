<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4주 측정 리포트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F04A}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 56px 20px 28px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="홈으로" style="width: 40px; height: 40px; border-radius: 12px; background: #1C1D21; display: flex; align-items: center; justify-content: center; color: #F2F2F0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #A3A6AD">2회차 정식 측정 · 예시 데이터</span>
      <span style="font-size: 22px; font-weight: 900">4주 측정 리포트</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; border-radius: 20px; background: #1C1D21; border: 1px solid #2A2C31">
    <svg width="260" height="220" viewBox="10 20 280 260" role="img" aria-label="6개 영역 레이더 차트: 지난번보다 당기기, 밀기, 코어, 그립, 유산소가 늘고 하체는 비슷함">
      <polygon points="150,40 245.3,95 245.3,205 150,260 54.7,205 54.7,95" fill="none" stroke="#2A2C31" stroke-width="1"></polygon>
      <polygon points="150,76.7 213.5,113.3 213.5,186.7 150,223.3 86.5,186.7 86.5,113.3" fill="none" stroke="#2A2C31" stroke-width="1"></polygon>
      <polygon points="150,113.3 181.8,131.7 181.8,168.3 150,186.7 118.2,168.3 118.2,131.7" fill="none" stroke="#2A2C31" stroke-width="1"></polygon>
      <path d="M150 150L150 40M150 150L245.3 95M150 150L245.3 205M150 150L150 260M150 150L54.7 205M150 150L54.7 95" stroke="#2A2C31" stroke-width="1"></path>
      <polygon points="150,117 173.8,136.3 197.6,177.5 150,199.5 111.9,172 92.8,117" fill="none" stroke="#A3A6AD" stroke-width="2" stroke-dasharray="4 4"></polygon>
      <polygon points="150,89.5 188.1,128 197.6,177.5 150,216 97.6,180.3 83.3,111.5" fill="rgba(200,240,74,0.28)" stroke="#C8F04A" stroke-width="2.5"></polygon>
      <text x="150" y="32" text-anchor="middle" fill="#F2F2F0" font-size="13" font-weight="700">당기기</text>
      <text x="252" y="90" text-anchor="start" fill="#F2F2F0" font-size="13" font-weight="700">밀기</text>
      <text x="252" y="216" text-anchor="start" fill="#F2F2F0" font-size="13" font-weight="700">하체</text>
      <text x="150" y="276" text-anchor="middle" fill="#F2F2F0" font-size="13" font-weight="700">코어</text>
      <text x="48" y="216" text-anchor="end" fill="#F2F2F0" font-size="13" font-weight="700">그립</text>
      <text x="48" y="90" text-anchor="end" fill="#F2F2F0" font-size="13" font-weight="700">유산소</text>
    </svg>
    <div style="display: flex; gap: 16px; padding-bottom: 8px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3A6AD"><span style="width: 14px; height: 3px; background: #C8F04A"></span>이번</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3A6AD"><span style="width: 14px; height: 0; border-top: 2px dashed #A3A6AD"></span>지난번</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; padding: 2px 16px; border-radius: 16px; background: #1C1D21; border: 1px solid #2A2C31">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 9px 0; border-bottom: 1px solid #2A2C31">
        <span style="font-size: 13px; font-weight: 700">{{r.name}}</span>
        <span style="font-size: 13px; color: #A3A6AD; text-align: right">{{r.before}}</span>
        <span style="font-size: 13px; font-weight: 700; text-align: right">{{r.after}}</span>
        <span style="{{r.deltaStyle}}">{{r.delta}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; border: 1px solid #2A2C31">
    <span style="font-size: 12px; font-weight: 700; color: #C8F04A">다음 4주 자동 조정</span>
    <span style="font-size: 13px; line-height: 1.6">턱걸이 세트당 3회 (새 최대 5회의 60%) · 긴 인터벌 5:02/km, 짧은 인터벌 4:52/km · 하체는 한 번 더 정체면 변형 동작 교체</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = 'font-size: 12px; font-weight: 700; text-align: right; ';
    var up = d + 'color: #C8F04A;';
    var flat = d + 'color: #A3A6AD;';
    return {
      rows: [
        { name: '턱걸이', before: '3회', after: '5회', delta: '+2', deltaStyle: up },
        { name: '링 딥스', before: '1회', after: '2회', delta: '+1', deltaStyle: up },
        { name: '불가리안', before: '14회', after: '15회', delta: '정체', deltaStyle: flat },
        { name: '할로우 홀드', before: '40초', after: '52초', delta: '+12초', deltaStyle: up },
        { name: '데드행', before: '45초', after: '60초', delta: '+15초', deltaStyle: up },
        { name: '3km', before: '15:40', after: '15:05', delta: '−35초', deltaStyle: up }
      ]
    };
  }
}
</script>
</body>
</html>
