<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>컨디션 체크인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8F04A}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F2F2F0; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 32px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 40px; height: 40px; border-radius: 12px; background: #1C1D21; display: flex; align-items: center; justify-content: center; color: #F2F2F0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #A3A6AD">시작 전 30초</span>
      <span style="font-size: 22px; font-weight: 900">오늘 컨디션은?</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700">피로도</span>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{fatigue}}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{f.pick}}" style="{{f.style}}">
          <span style="font-size: 18px; font-weight: 900">{{f.n}}</span>
          <span style="font-size: 11px">{{f.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700">근육통 있는 부위</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{parts}}" as="p" hint-placeholder-count="6">
        <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 15px; font-weight: 700">찌릿하거나 날카로운 통증이 있나요?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" onClick="{{painNo}}" style="{{painNoStyle}}">없음</button>
      <button type="button" onClick="{{painYes}}" style="{{painYesStyle}}">있음</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; background: #1C1D21; border: 1px solid #2A2C31">
    <span style="font-size: 12px; font-weight: 700; color: #C8F04A">트레이너 판단</span>
    <span style="font-size: 18px; font-weight: 900">{{verdict}}</span>
    <span style="font-size: 14px; line-height: 1.5; color: #A3A6AD">{{detail}}</span>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Workout.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #C8F04A; color: #111214; font-size: 17px; font-weight: 900; text-decoration: none">워밍업 스트레칭부터 시작</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fatigue: 2, parts: ['하체'], pain: false };
  }
  renderVals() {
    var s = this.state;
    var self = this;
    var chipOn = 'border: 1px solid #C8F04A; background: #C8F04A; color: #111214; ';
    var chipOff = 'border: 1px solid #2A2C31; background: #1C1D21; color: #F2F2F0; ';
    var labels = ['쌩쌩', '좋음', '보통', '피곤', '녹초'];
    var fatigue = labels.map(function (l, i) {
      return {
        n: String(i + 1), label: l,
        style: (s.fatigue === i + 1 ? chipOn : chipOff) + 'height: 64px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: pointer;',
        pick: function () { self.setState({ fatigue: i + 1 }); }
      };
    });
    var names = ['가슴', '어깨', '팔', '등', '하체', '없음'];
    var parts = names.map(function (n) {
      var on = s.parts.indexOf(n) >= 0;
      return {
        name: n,
        style: (on ? chipOn : chipOff) + 'height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;',
        pick: function () {
          if (n === '없음') { self.setState({ parts: ['없음'] }); return; }
          var cur = s.parts.filter(function (x) { return x !== '없음'; });
          var next = cur.indexOf(n) >= 0 ? cur.filter(function (x) { return x !== n; }) : cur.concat([n]);
          self.setState({ parts: next.length ? next : ['없음'] });
        }
      };
    });
    var btn = 'height: 52px; border-radius: 14px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; ';
    var verdict, detail;
    if (s.pain) {
      verdict = '오늘은 가벼운 휴식으로 전환';
      detail = '통증은 예외입니다. 스트레칭 10분만 하고 스트릭은 유지합니다.';
    } else if (s.fatigue >= 4 || s.parts.indexOf('가슴') >= 0 || s.parts.indexOf('어깨') >= 0) {
      verdict = '운동량 70%로 진행';
      detail = '세트 수를 줄입니다. 대신 자세는 한 치도 봐주지 않습니다.';
    } else {
      verdict = '계획대로 100% 진행';
      detail = '하체 근육통은 오늘 밀기와 상관없습니다. 핑계 없이 갑니다.';
    }
    return {
      fatigue: fatigue, parts: parts, verdict: verdict, detail: detail,
      painNo: function () { self.setState({ pain: false }); },
      painYes: function () { self.setState({ pain: true }); },
      painNoStyle: btn + (s.pain ? chipOff : chipOn),
      painYesStyle: btn + (s.pain ? chipOn : chipOff)
    };
  }
}
</script>
</body>
</html>
